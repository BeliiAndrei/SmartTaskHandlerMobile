name: smart_task_handler_mobile
description: "SmartTaskHandler mobile application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.0.2
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  provider: ^6.1.5+1
  http: ^1.6.0
  shared_preferences: ^2.5.6
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# path_provider_android 2.3.x requires libdartjni.so, which is missing from
# the current Android build. Keep the pre-JNI implementation for this lab.
dependency_overrides:
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
